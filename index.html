<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Salary Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --gold: #f0a500;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        /* Navigation */
        .nav-bar {
            background: rgba(26, 26, 46, 0.95);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            border: 1px solid rgba(240, 165, 0, 0.3);
        }

        .nav-btn {
            padding: 12px 25px;
            border-radius: 10px;
            border: 2px solid var(--gold);
            background: transparent;
            color: var(--gold);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 16px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--gold);
            color: #1a1a2e;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(240, 165, 0, 0.3);
        }

        /* Cards */
        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .container-wide {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(240, 165, 0, 0.3);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .card-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
        }

        .card-header i {
            font-size: 40px;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .card-header h3 {
            color: white;
            font-weight: 700;
            margin: 10px 0 5px;
        }

        .card-header p {
            color: var(--gold);
            font-size: 14px;
        }

        .card-body {
            padding: 25px;
        }

        /* Form Elements */
        .form-label {
            color: #e0e0e0;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            font-size: 14px;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 14px 15px;
            border-radius: 10px;
            border: 2px solid #2a2a4a;
            background: rgba(15, 15, 30, 0.8);
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }

        .form-control::placeholder {
            color: #666;
        }

        select.form-select option {
            background: #1a1a2e;
            color: white;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #f0a500, #e94560);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(233, 69, 96, 0.4);
        }

        .btn-success:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
        }

        .btn-outline:hover {
            background: var(--gold);
            color: #1a1a2e;
            transform: translateY(-2px);
        }

        .btn-sm {
            width: auto;
            padding: 8px 20px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-group .btn {
            margin-bottom: 0;
        }

        /* Alerts */
        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: 500;
            font-size: 14px;
        }

        .alert-success {
            background: rgba(0, 200, 83, 0.2);
            border: 1px solid #00c853;
            color: #69f0ae;
        }

        .alert-danger {
            background: rgba(255, 23, 68, 0.2);
            border: 1px solid #ff1744;
            color: #ff6e81;
        }

        .alert-warning {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #ffd54f;
        }

        .alert-info {
            background: rgba(0, 188, 212, 0.2);
            border: 1px solid #00bcd4;
            color: #4dd0e1;
        }

        /* Employee Info */
        .employee-info {
            background: rgba(240, 165, 0, 0.1);
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .employee-info p {
            color: white;
            margin: 5px 0;
            font-size: 14px;
        }

        .employee-info strong {
            color: var(--gold);
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
        }

        .salary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .salary-table th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 10px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .salary-table td {
            padding: 10px;
            border-bottom: 1px solid #2a2a4a;
            color: #e0e0e0;
            white-space: nowrap;
        }

        .salary-table tbody tr:hover td {
            background: rgba(102, 126, 234, 0.1);
        }

        .total-row {
            background: rgba(240, 165, 0, 0.15) !important;
            font-weight: 700;
        }

        .total-row td {
            color: var(--gold) !important;
            font-weight: 700;
        }

        .amount-cell {
            color: var(--gold) !important;
            font-weight: 600;
        }

        .section-title {
            color: var(--gold);
            font-size: 18px;
            font-weight: 700;
            margin: 25px 0 10px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gold);
        }

        .grand-total {
            background: linear-gradient(135deg, #f0a500, #e94560);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 25px;
            font-size: 22px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
        }

        /* Loading */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(240, 165, 0, 0.2);
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            color: var(--gold);
            margin-top: 20px;
            font-size: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Admin Panel */
        .upload-area {
            border: 2px dashed var(--gold);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(240, 165, 0, 0.05);
        }

        .upload-area:hover {
            background: rgba(240, 165, 0, 0.1);
            border-color: var(--accent);
        }

        .upload-area i {
            font-size: 40px;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .upload-area p {
            color: #ccc;
            margin: 5px 0;
        }

        .preview-section {
            background: rgba(15, 15, 30, 0.8);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #2a2a4a;
        }

        /* Print */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
            }
            .card {
                box-shadow: none !important;
                border: 1px solid #000 !important;
                background: white !important;
            }
            .card-header {
                background: #1a1a2e !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .salary-table th {
                background: #667eea !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .salary-table td {
                color: black !important;
            }
            .grand-total {
                background: #f0a500 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .section-title {
                color: #000 !important;
                border-bottom-color: #000 !important;
            }
            .no-print, .nav-bar, .loading-overlay {
                display: none !important;
            }
            .container-wide {
                max-width: 100% !important;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .card-body {
                padding: 15px;
            }
            .salary-table th, .salary-table td {
                font-size: 11px;
                padding: 6px 4px;
            }
            .grand-total {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p class="loading-text" id="loadingText">Loading...</p>
    </div>

    <!-- Navigation -->
    <div class="nav-bar no-print">
        <button class="nav-btn active" onclick="showPage('employee')" id="navEmployee">
            <i class="fas fa-user"></i> Employee Portal
        </button>
        <button class="nav-btn" onclick="showPage('admin')" id="navAdmin">
            <i class="fas fa-shield-alt"></i> Admin Panel
        </button>
    </div>

    <!-- ============ EMPLOYEE PORTAL ============ -->
    <div id="employeePage">
        <!-- Login Card -->
        <div class="container" id="loginCard">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-gem"></i>
                    <h3>Salary Slip Portal</h3>
                    <p>Diamond Enterprise</p>
                </div>
                <div class="card-body">
                    <div id="message"></div>
                    
                    <label class="form-label">
                        <i class="fas fa-building"></i> Select Department
                    </label>
                    <select id="dept" class="form-select">
                        <option value="">-- Choose Department --</option>
                    </select>

                    <label class="form-label">
                        <i class="fas fa-id-card"></i> Enter PAN Number
                    </label>
                    <input type="text" id="pan" class="form-control" 
                           maxlength="10" placeholder="ABCDE1234F" autocomplete="off">

                    <button class="btn btn-primary" onclick="verifyPAN()">
                        <i class="fas fa-search"></i> Verify PAN
                    </button>

                    <div id="verifiedSection" style="display:none;">
                        <div class="employee-info" id="employeeInfo"></div>
                        
                        <label class="form-label">
                            <i class="fas fa-calendar"></i> Select Month
                        </label>
                        <select id="month" class="form-select">
                            <option value="">-- Choose Month --</option>
                        </select>

                        <button class="btn btn-success" id="viewBtn" disabled onclick="viewSalary()">
                            <i class="fas fa-eye"></i> View Salary Slip
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Salary Card -->
        <div class="container-wide" id="salaryCard" style="display:none;">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-file-invoice"></i> Salary Slip</h3>
                    <p id="slipDate"></p>
                </div>
                <div class="card-body">
                    <div id="salaryContent"></div>
                    <div class="btn-group no-print" style="margin-top:20px;">
                        <button class="btn btn-outline btn-sm" onclick="goBack()">
                            <i class="fas fa-arrow-left"></i> Back
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="window.print()">
                            <i class="fas fa-print"></i> Print
                        </button>
                        <button class="btn btn-success btn-sm" onclick="downloadPDF()">
                            <i class="fas fa-download"></i> PDF
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ ADMIN PANEL ============ -->
    <div id="adminPage" style="display:none;">
        <div class="container-wide">
            <!-- Admin Login -->
            <div class="card" id="adminLoginCard">
                <div class="card-header">
                    <i class="fas fa-lock"></i>
                    <h3>Admin Login</h3>
                </div>
                <div class="card-body">
                    <div id="adminMessage"></div>
                    
                    <label class="form-label">Username</label>
                    <input type="text" id="adminUsername" class="form-control" placeholder="Enter username">
                    
                    <label class="form-label">Password</label>
                    <input type="password" id="adminPassword" class="form-control" placeholder="Enter password">
                    
                    <button class="btn btn-primary" onclick="adminLogin()">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </div>
            </div>

            <!-- Admin Dashboard -->
            <div class="card" id="adminDashboard" style="display:none;">
                <div class="card-header">
                    <i class="fas fa-tachometer-alt"></i>
                    <h3>Admin Dashboard</h3>
                </div>
                <div class="card-body">
                    <h5 style="color:var(--gold); margin-bottom:20px;">
                        <i class="fas fa-upload"></i> Upload Salary Data
                    </h5>
                    
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px;">
                        <div>
                            <label class="form-label">Department</label>
                            <select id="uploadDept" class="form-select">
                                <option value="">Select Department</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">Sheet Type</label>
                            <select id="uploadType" class="form-select">
                                <option value="main">Main (Full Process)</option>
                                <option value="uchak">Uchak Process</option>
                            </select>
                        </div>
                    </div>

                    <div class="upload-area" onclick="document.getElementById('uploadFile').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p><strong>Click to Upload Excel/CSV File</strong></p>
                        <p style="font-size:12px;">Supports: .xlsx, .xls, .csv</p>
                        <input type="file" id="uploadFile" style="display:none;" 
                               accept=".xlsx,.xls,.csv" onchange="previewFile()">
                    </div>
                    <p id="fileName" style="color:#ccc; text-align:center;"></p>

                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="previewData()">
                            <i class="fas fa-eye"></i> Preview
                        </button>
                        <button class="btn btn-success" id="uploadBtn" disabled onclick="uploadData()">
                            <i class="fas fa-cloud-upload-alt"></i> Upload
                        </button>
                    </div>

                    <div class="preview-section" id="previewSection" style="display:none;"></div>
                    <div id="uploadMessage" style="margin-top:15px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ CONFIGURATION ============
        const SUPABASE_URL = 'https://jeofxxumyoiaqggblggj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_uDkMJr191UEjs__tahpHMw_ipl72MwZ';
        const API_URL = SUPABASE_URL + '/functions/v1/salary-api';

        let currentEmployee = null;
        let salaryData = null;
        let uploadFileData = null;

        // ============ NAVIGATION ============
        function showPage(page) {
            document.getElementById('employeePage').style.display = page === 'employee' ? 'block' : 'none';
            document.getElementById('adminPage').style.display = page === 'admin' ? 'block' : 'none';
            
            document.getElementById('navEmployee').classList.toggle('active', page === 'employee');
            document.getElementById('navAdmin').classList.toggle('active', page === 'admin');
            
            if (page === 'admin') {
                checkAdminSession();
            }
        }

        // ============ LOADING ============
        function showLoading(text = 'Loading...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }

        // ============ MESSAGES ============
        function showMessage(msg, type = 'danger') {
            document.getElementById('message').innerHTML = 
                `<div class="alert alert-${type}">${msg}</div>`;
            if (type === 'success') {
                setTimeout(() => document.getElementById('message').innerHTML = '', 5000);
            }
        }

        function showAdminMessage(msg, type = 'danger') {
            document.getElementById('adminMessage').innerHTML = 
                `<div class="alert alert-${type}">${msg}</div>`;
        }

        function showUploadMessage(msg, type = 'info') {
            document.getElementById('uploadMessage').innerHTML = 
                `<div class="alert alert-${type}">${msg}</div>`;
        }

        // ============ INITIALIZATION ============
        window.onload = async function() {
            await loadDepartments();
        };

        async function loadDepartments() {
            showLoading('Loading...');
            try {
                const response = await fetch(API_URL + '/departments', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await response.json();
                
                if (data.success) {
                    const selects = ['dept', 'uploadDept'];
                    selects.forEach(id => {
                        const sel = document.getElementById(id);
                        if (sel) {
                            sel.innerHTML = '<option value="">-- Choose --</option>';
                            data.departments.forEach(dept => {
                                sel.innerHTML += `<option value="${dept.code}">${dept.name || dept.code}</option>`;
                            });
                        }
                    });
                }
                hideLoading();
            } catch (error) {
                hideLoading();
                console.error('Failed to load departments:', error);
            }
        }

        // Auto uppercase PAN
        document.getElementById('pan')?.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });

        // Enter key for PAN
        document.getElementById('pan')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyPAN();
        });

        // Enable view button when month selected
        document.getElementById('month')?.addEventListener('change', function() {
            document.getElementById('viewBtn').disabled = !this.value;
        });

        // ============ VERIFY PAN ============
        async function verifyPAN() {
            const dept = document.getElementById('dept').value;
            const pan = document.getElementById('pan').value.trim();

            if (!dept) return showMessage('Please select department', 'warning');
            if (!pan || pan.length !== 10) return showMessage('Please enter valid 10-digit PAN', 'warning');

            showLoading('Verifying...');
            
            try {
                const response = await fetch(API_URL + '/verify-employee', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({dept, pan})
                });
                const data = await response.json();

                if (data.success) {
                    currentEmployee = { dept, pan, name: data.name, code: data.code };

                    document.getElementById('employeeInfo').innerHTML = `
                        <p><strong>👤 Name:</strong> ${data.name}</p>
                        <p><strong>🆔 Code:</strong> ${data.code || 'N/A'}</p>
                        <p><strong>💳 PAN:</strong> ${pan}</p>
                    `;

                    const monthSelect = document.getElementById('month');
                    monthSelect.innerHTML = '<option value="">-- Choose Month --</option>';
                    data.months.forEach(m => {
                        monthSelect.innerHTML += `<option value="${m}">${m}</option>`;
                    });

                    document.getElementById('verifiedSection').style.display = 'block';
                    showMessage(`✅ Verified! ${data.months.length} months available`, 'success');
                } else {
                    showMessage('❌ ' + data.message, 'danger');
                }
                hideLoading();
            } catch (error) {
                hideLoading();
                showMessage('Network error. Please try again.', 'danger');
            }
        }

        // ============ VIEW SALARY ============
        async function viewSalary() {
            const month = document.getElementById('month').value;
            if (!month || !currentEmployee) return;

            showLoading('Loading salary slip...');

            try {
                const response = await fetch(API_URL + '/get-salary', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        dept: currentEmployee.dept,
                        pan: currentEmployee.pan,
                        month: month
                    })
                });
                const data = await response.json();

                if (data.success) {
                    salaryData = data;
                    displaySalary(data);
                } else {
                    showMessage('❌ ' + data.message, 'danger');
                }
                hideLoading();
            } catch (error) {
                hideLoading();
                showMessage('Network error. Please try again.', 'danger');
            }
        }

        function displaySalary(data) {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('salaryCard').style.display = 'block';
            document.getElementById('slipDate').textContent = 'Generated: ' + data.employee.generatedAt;

            let html = `
                <div class="employee-info" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                    <p><strong>👤 Name:</strong> ${data.employee.name}</p>
                    <p><strong>🏢 Department:</strong> ${data.employee.department}</p>
                    <p><strong>💳 PAN:</strong> ${data.employee.pan}</p>
                    <p><strong>📅 Month:</strong> ${data.employee.month}</p>
                    ${data.employee.code ? `<p><strong>🆔 Code:</strong> ${data.employee.code}</p>` : ''}
                </div>
            `;

            if (data.main.rows && data.main.rows.length > 0) {
                html += `<h4 class="section-title">📋 Full Process (Main)</h4>`;
                html += buildTable(data.main);
            }

            if (data.uchak.rows && data.uchak.rows.length > 0) {
                html += `<h4 class="section-title">📋 Uchak Process</h4>`;
                html += buildTable(data.uchak);
            }

            html += `
                <div class="grand-total">
                    💰 Grand Total: ₹${data.grandTotal.toLocaleString('en-IN')}
                </div>
            `;

            document.getElementById('salaryContent').innerHTML = html;
            window.scrollTo(0, 0);
        }

        function buildTable(sectionData) {
            if (!sectionData.rows || sectionData.rows.length === 0) {
                return '<p style="color:#ccc;">No records found</p>';
            }

            const headers = new Set();
            sectionData.rows.forEach(row => {
                Object.keys(row).forEach(key => {
                    if (!key.startsWith('_') && key !== 'month') headers.add(key);
                });
            });

            const headerArray = Array.from(headers);

            let table = '<div class="table-responsive"><table class="salary-table">';
            
            table += '<thead><tr>';
            headerArray.forEach(h => table += `<th>${h}</th>`);
            table += '</tr></thead>';

            table += '<tbody>';
            sectionData.rows.forEach(row => {
                table += '<tr>';
                headerArray.forEach(h => {
                    let value = row[h];
                    if (value === null || value === undefined || value === '') {
                        value = '-';
                    } else if (typeof value === 'number') {
                        const hLower = h.toLowerCase();
                        if (hLower.includes('amount') || hLower.includes('rate')) {
                            value = '₹' + value.toLocaleString('en-IN');
                        } else if (hLower.includes('carat')) {
                            value = value.toFixed(3);
                        } else if (hLower.includes('pcs')) {
                            value = value.toLocaleString('en-IN');
                        }
                    }
                    const isAmount = h.toLowerCase().includes('amount') || h.toLowerCase().includes('rate');
                    table += `<td class="${isAmount ? 'amount-cell' : ''}">${value}</td>`;
                });
                table += '</tr>';
            });
            table += '</tbody>';

            table += '<tfoot><tr class="total-row">';
            headerArray.forEach((h, index) => {
                if (index === headerArray.length - 1) {
                    table += `<td><strong>₹${sectionData.total.toLocaleString('en-IN')}</strong></td>`;
                } else if (index === headerArray.length - 2) {
                    table += '<td><strong>Total:</strong></td>';
                } else {
                    table += '<td></td>';
                }
            });
            table += '</tr></tfoot>';

            table += '</table></div>';
            return table;
        }

        function goBack() {
            document.getElementById('salaryCard').style.display = 'none';
            document.getElementById('loginCard').style.display = 'block';
            document.getElementById('message').innerHTML = '';
            window.scrollTo(0, 0);
        }

        async function downloadPDF() {
            if (!salaryData) return;
            showLoading('Generating PDF...');
            
            try {
                const element = document.getElementById('salaryContent');
                const canvas = await html2canvas(element, { 
                    scale: 2, 
                    backgroundColor: '#ffffff',
                    useCORS: true
                });
                
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('landscape', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                const ratio = Math.min(pdfWidth / canvas.width, pdfHeight / canvas.height) * 0.95;
                
                pdf.addImage(
                    canvas.toDataURL('image/jpeg', 1.0), 
                    'JPEG', 
                    (pdfWidth - canvas.width * ratio) / 2, 
                    5, 
                    canvas.width * ratio, 
                    canvas.height * ratio
                );
                
                pdf.save(`SalarySlip_${currentEmployee.name}_${currentEmployee.pan}.pdf`);
                hideLoading();
            } catch (error) {
                hideLoading();
                alert('PDF generation failed. Please try printing instead.');
            }
        }

        // ============ ADMIN FUNCTIONS ============
        function checkAdminSession() {
            const token = sessionStorage.getItem('adminToken');
            if (token) {
                document.getElementById('adminLoginCard').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
            }
        }

        async function adminLogin() {
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;

            if (!username || !password) {
                return showAdminMessage('Please enter username and password', 'warning');
            }

            showLoading('Logging in...');
            
            try {
                const response = await fetch(API_URL + '/admin-login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('adminToken', data.token);
                    document.getElementById('adminLoginCard').style.display = 'none';
                    document.getElementById('adminDashboard').style.display = 'block';
                    showAdminMessage('✅ Login successful!', 'success');
                } else {
                    showAdminMessage('❌ ' + data.message, 'danger');
                }
                hideLoading();
            } catch (error) {
                hideLoading();
                showAdminMessage('Network error. Please try again.', 'danger');
            }
        }

        function previewFile() {
            const file = document.getElementById('uploadFile').files[0];
            if (file) {
                document.getElementById('fileName').textContent = '📄 ' + file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const workbook = XLSX.read(e.target.result, {type: 'binary'});
                        const firstSheet = workbook.SheetNames[0];
                        uploadFileData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
                        document.getElementById('uploadBtn').disabled = false;
                        showUploadMessage(`✅ File loaded! ${uploadFileData.length} records found.`, 'success');
                    } catch (error) {
                        showUploadMessage('❌ Error reading file: ' + error.message, 'danger');
                    }
                };
                reader.readAsBinaryString(file);
            }
        }

        function previewData() {
            if (!uploadFileData) {
                return showUploadMessage('Please select a file first', 'warning');
            }

            const previewRows = uploadFileData.slice(0, 10);
            let html = '<h6 style="color:var(--gold);">Preview (First 10 rows)</h6>';
            html += '<div class="table-responsive"><table class="salary-table"><thead><tr>';
            
            Object.keys(previewRows[0]).forEach(key => {
                html += `<th>${key}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            previewRows.forEach(row => {
                html += '<tr>';
                Object.values(row).forEach(val => {
                    html += `<td>${val || '-'}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            html += `<p style="color:#ccc; margin-top:10px;">Total: ${uploadFileData.length} records</p>`;
            
            document.getElementById('previewSection').innerHTML = html;
            document.getElementById('previewSection').style.display = 'block';
        }

        async function uploadData() {
            if (!uploadFileData) return;
            
            const dept = document.getElementById('uploadDept').value;
            const type = document.getElementById('uploadType').value;
            const token = sessionStorage.getItem('adminToken');

            if (!dept) return showUploadMessage('Please select department', 'warning');
            if (!token) return showUploadMessage('Please login first', 'warning');

            showLoading('Uploading data...');
            
            try {
                const response = await fetch(API_URL + '/upload-salary', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        token,
                        department: dept,
                        sheetType: type,
                        data: uploadFileData
                    })
                });
                const data = await response.json();

                if (data.success) {
                    showUploadMessage(
                        `✅ Success! Processed: ${data.processed}, Inserted: ${data.inserted}`, 
                        'success'
                    );
                    document.getElementById('uploadFile').value = '';
                    document.getElementById('fileName').textContent = '';
                    document.getElementById('uploadBtn').disabled = true;
                    document.getElementById('previewSection').style.display = 'none';
                    uploadFileData = null;
                } else {
                    showUploadMessage('❌ ' + (data.message || 'Upload failed'), 'danger');
                }
                hideLoading();
            } catch (error) {
                hideLoading();
                showUploadMessage('Network error. Please try again.', 'danger');
            }
        }
    </script>
